services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: placementor_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-placement_portal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-9347}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-placement_portal}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - placementor-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: placementor_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-9347}@postgres:5432/${POSTGRES_DB:-placement_portal}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - placementor-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: placementor_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - placementor-network

volumes:
  postgres_data:
  uploads_data:

networks:
  placementor-network:
    driver: bridge
